name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8
        with:
          pixi-version: latest
          environments: dev
      - run: pixi run test
      - run: pixi run lint
      - run: pixi run typecheck
