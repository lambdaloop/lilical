<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Portable config for the lilical AppImage.
    This file lives at $APPDIR/etc/fonts/fonts.conf.
    prefix="relative" resolves paths relative to this file, so the
    AppImage works regardless of where it is extracted.
  -->
  <dir prefix="relative">../../usr/share/fonts/lilical</dir>

  <!-- Writable cache; fontconfig scans bundled fonts on first launch. -->
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>/tmp/lilical-fontconfig</cachedir>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Ubuntu</family>
      <family>DejaVu Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Ubuntu Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
