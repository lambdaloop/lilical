<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="Inter, -apple-system, sans-serif">
  <!-- ============ shared defs ============ -->
  <defs>
    <style>
      .bg        { fill: #1e1e2a; }
      .surface   { fill: #2a2a38; }
      .surface2  { fill: #34344a; }
      .surface3  { fill: #3d3d55; }
      .border    { stroke: #4a4a60; stroke-width: 1; }
      .border-strong { stroke: #6b6b85; stroke-width: 1; }
      .text      { fill: #e6e6f0; }
      .text-dim  { fill: #9a9ab0; }
      .text-tiny { fill: #7e7e95; font-size: 9px; }
      .annot     { fill: #ffb86c; font-size: 11px; font-weight: 600; }
      .annot-line{ stroke: #ffb86c; stroke-width: 1; stroke-dasharray: 3 2; fill: none; }
      .label     { font-size: 13px; font-weight: 600; fill: #cfd0e0; }
      .heading   { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .chip-text { font-size: 9px; fill: #ffffff; }
      .pill-title{ font-size: 11px; font-weight: 700; fill: #ffffff; }
      .pill-time { font-size: 10px; fill: #c5c5d8; }
      .pill-loc  { font-size: 9px; fill: #a3a3b8; }
      .pill-meta { font-size: 9px; fill: #888899; letter-spacing: 0.6px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1400" height="860" class="bg"/>

  <!-- ================================================================== -->
  <!-- LEFT PANEL: window layout overview                                 -->
  <!-- ================================================================== -->
  <g transform="translate(30, 40)">
    <text x="0" y="0" class="heading">Window layout — three panes</text>
    <text x="0" y="22" class="text-dim" font-size="12">
      QSplitter (horizontal): left sidebar · calendar view · NEW inspector pane
    </text>

    <!-- whole window frame -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="640" height="440" rx="8" class="surface" stroke="#5a5a72" stroke-width="1.5"/>

      <!-- toolbar -->
      <rect x="0" y="0" width="640" height="30" rx="8" class="surface2"/>
      <rect x="0" y="20" width="640" height="10" class="surface2"/>
      <text x="12" y="20" class="text-dim" font-size="10">Mon Tue Wed  · Today ›  · May 25–31  ·  ✚  ⚡  ⟳        ⚙</text>

      <!-- left sidebar -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="140" height="410" class="surface"/>
        <line x1="140" y1="0" x2="140" y2="410" class="border"/>
        <text x="14" y="22" class="text-dim" font-size="10">May 2026</text>
        <g transform="translate(10, 30)">
          <!-- mini-month grid -->
          <g fill="#888899" font-size="8">
            <text x="0" y="10">S M T W T F S</text>
          </g>
          <g fill="#cfd0e0" font-size="8">
            <text x="0" y="24">                1  2</text>
            <text x="0" y="36">3  4  5  6  7  8  9</text>
            <text x="0" y="48">10 11 12 13 14 15 16</text>
            <text x="0" y="60">17 18 19 20 21 22 23</text>
            <text x="0" y="72">24</text>
            <rect x="14" y="64" width="14" height="11" fill="#5e7fff" opacity="0.6" rx="2"/>
            <text x="16" y="72" fill="#ffffff">25</text>
            <text x="28" y="72">26 27 28 29 30</text>
            <text x="0" y="84">31</text>
          </g>
        </g>
        <text x="14" y="146" class="text-dim" font-size="9" letter-spacing="0.8">CALENDARS</text>
        <g transform="translate(10, 160)" font-size="9" fill="#cfd0e0">
          <circle cx="6" cy="6" r="4" fill="#5e9fff"/><text x="16" y="9">Work</text>
          <circle cx="6" cy="22" r="4" fill="#ff6f91"/><text x="16" y="25">Personal</text>
          <circle cx="6" cy="38" r="4" fill="#6ee896"/><text x="16" y="41">Holidays</text>
        </g>
      </g>

      <!-- calendar (week) view -->
      <g transform="translate(140, 30)">
        <rect x="0" y="0" width="340" height="410" class="bg"/>
        <line x1="340" y1="0" x2="340" y2="410" class="border"/>
        <!-- day headers -->
        <g font-size="8" fill="#9a9ab0">
          <text x="6" y="14">25</text><text x="55" y="14">26</text><text x="104" y="14">27</text>
          <text x="153" y="14">28</text><text x="202" y="14">29</text><text x="251" y="14">30</text>
          <text x="300" y="14">31</text>
        </g>
        <line x1="0" y1="22" x2="340" y2="22" class="border"/>

        <!-- time axis -->
        <g font-size="7" fill="#7e7e95">
          <text x="2" y="38">8</text>
          <text x="2" y="68">9</text>
          <text x="2" y="98">10</text>
          <text x="2" y="128">11</text>
          <text x="2" y="158">12</text>
          <text x="2" y="188">13</text>
          <text x="2" y="218">14</text>
          <text x="2" y="248">15</text>
        </g>

        <!-- sample event chips (rough mockup) -->
        <g>
          <!-- Mon column: cluster (3 overlapping events 9-10:30) -->
          <rect x="16" y="60" width="32" height="40" fill="#5e9fff" rx="2"/>
          <text x="20" y="72" class="chip-text">Standup</text>
          <rect x="20" y="70" width="28" height="36" fill="#7d6cff" rx="2" opacity="0.95"/>
          <text x="24" y="82" class="chip-text">1:1</text>
          <rect x="24" y="80" width="24" height="32" fill="#ff6f91" rx="2" opacity="0.95"/>
          <text x="28" y="92" class="chip-text">Review</text>
          <!-- cluster spine indicator (thin bar showing "this is a cluster") -->
          <rect x="14" y="60" width="2" height="52" fill="#ffb86c"/>

          <!-- other days, looser events -->
          <rect x="65" y="60" width="40" height="30" fill="#5e9fff" rx="2"/>
          <text x="70" y="72" class="chip-text">Email</text>
          <rect x="65" y="110" width="40" height="60" fill="#ff6f91" rx="2"/>
          <text x="70" y="124" class="chip-text">Lunch</text>

          <rect x="114" y="80" width="40" height="80" fill="#7d6cff" rx="2"/>
          <text x="118" y="92" class="chip-text">Design</text>

          <rect x="163" y="60" width="40" height="120" fill="#5e9fff" rx="2"/>
          <text x="168" y="72" class="chip-text">Workshop</text>

          <rect x="212" y="90" width="40" height="40" fill="#6ee896" rx="2"/>
          <text x="216" y="102" class="chip-text">Walk</text>

          <rect x="261" y="60" width="40" height="50" fill="#ff6f91" rx="2"/>
          <text x="265" y="72" class="chip-text">Sync</text>
        </g>

        <!-- cursor indicator -->
        <g>
          <circle cx="36" cy="86" r="3" fill="#ffb86c"/>
          <text x="42" y="90" class="annot" font-size="9">cursor</text>
        </g>
      </g>

      <!-- inspector pane (the new one) -->
      <g transform="translate(480, 30)">
        <rect x="0" y="0" width="160" height="410" class="surface2"/>
        <rect x="0" y="0" width="160" height="410" fill="none" stroke="#ffb86c" stroke-width="2" stroke-dasharray="4 3"/>

        <!-- top section: hovered event -->
        <g transform="translate(10, 12)">
          <text x="0" y="10" class="pill-meta">HOVERED</text>
          <text x="0" y="32" class="pill-title">Code review</text>
          <text x="0" y="48" class="pill-time">09:30 – 10:30</text>
          <text x="0" y="64" class="pill-loc">📍 Online (Zoom)</text>
          <g transform="translate(0, 76)">
            <circle cx="4" cy="4" r="3" fill="#ff6f91"/>
            <text x="12" y="7" class="pill-loc">Work calendar</text>
          </g>
          <text x="0" y="104" class="pill-loc">Review the API changes</text>
          <text x="0" y="116" class="pill-loc">for the new pricing</text>
          <text x="0" y="128" class="pill-loc">flow. Bring questions.</text>
        </g>

        <line x1="10" y1="160" x2="150" y2="160" class="border"/>

        <!-- bottom section: cluster siblings -->
        <g transform="translate(10, 174)">
          <text x="0" y="10" class="pill-meta">CLUSTER · 09:00 – 10:30 · 3 EVENTS</text>

          <g transform="translate(0, 22)">
            <rect x="0" y="0" width="2" height="28" fill="#5e9fff"/>
            <text x="8" y="10" class="pill-time">09:00 – 09:30</text>
            <text x="8" y="22" class="pill-loc" font-weight="600" fill="#cfd0e0">Standup</text>
          </g>

          <g transform="translate(0, 56)">
            <rect x="0" y="0" width="2" height="28" fill="#7d6cff"/>
            <text x="8" y="10" class="pill-time">09:15 – 10:00</text>
            <text x="8" y="22" class="pill-loc" font-weight="600" fill="#cfd0e0">1:1 with Sam</text>
          </g>

          <g transform="translate(0, 90)">
            <rect x="0" y="0" width="2" height="28" fill="#ff6f91"/>
            <text x="8" y="10" class="pill-time">09:30 – 10:30</text>
            <text x="8" y="22" class="pill-loc" font-weight="600" fill="#cfd0e0">Code review ◀</text>
          </g>
        </g>
      </g>

      <!-- annotation arrow → inspector -->
      <path d="M 660 240 Q 690 240 690 200" class="annot-line"/>
      <text x="660" y="260" class="annot" text-anchor="end">NEW: Inspector pane</text>
      <text x="660" y="276" class="text-dim" font-size="10" text-anchor="end">always visible; content swaps on hover</text>
    </g>
  </g>

  <!-- ================================================================== -->
  <!-- RIGHT PANEL: inspector internals — two states                       -->
  <!-- ================================================================== -->
  <g transform="translate(770, 40)">
    <text x="0" y="0" class="heading">Inspector pane · internal layout</text>
    <text x="0" y="22" class="text-dim" font-size="12">
      Single column. Two stacked sections. Empty when nothing is hovered.
    </text>

    <!-- STATE A: single event hovered (no cluster) -->
    <g transform="translate(0, 50)">
      <text x="0" y="-6" class="label">A · single event hovered</text>
      <rect x="0" y="0" width="260" height="370" rx="6" class="surface2" stroke="#6b6b85" stroke-width="1"/>

      <g transform="translate(14, 18)">
        <text x="0" y="0" class="pill-meta">HOVERED</text>

        <text x="0" y="28" class="text" font-size="14" font-weight="700">
          Quarterly cross-functional
        </text>
        <text x="0" y="46" class="text" font-size="14" font-weight="700">
          product strategy sync
        </text>

        <text x="0" y="72" class="pill-time" font-size="11">⏰ 14:00 – 15:30</text>
        <text x="0" y="92" class="pill-time" font-size="11">📍 Conference Room A</text>

        <g transform="translate(0, 108)">
          <circle cx="5" cy="5" r="4" fill="#5e9fff"/>
          <text x="14" y="9" class="pill-time" font-size="11">Work · krchtchk@gmail.com</text>
        </g>

        <text x="0" y="142" class="pill-meta">NOTES</text>
        <text x="0" y="160" class="pill-loc" font-size="11">Sync across product, eng, and</text>
        <text x="0" y="176" class="pill-loc" font-size="11">design on Q3 roadmap. Brad will</text>
        <text x="0" y="192" class="pill-loc" font-size="11">share the new pricing model;</text>
        <text x="0" y="208" class="pill-loc" font-size="11">come prepared with feedback…</text>
      </g>

      <!-- no separator, no cluster section when not in a cluster -->
      <text x="14" y="354" class="text-tiny">(no cluster section — solo event)</text>
    </g>

    <!-- STATE B: event in a dense cluster -->
    <g transform="translate(310, 50)">
      <text x="0" y="-6" class="label">B · event in a dense cluster</text>
      <rect x="0" y="0" width="260" height="450" rx="6" class="surface2" stroke="#6b6b85" stroke-width="1"/>

      <g transform="translate(14, 18)">
        <text x="0" y="0" class="pill-meta">HOVERED</text>

        <text x="0" y="28" class="text" font-size="14" font-weight="700">Code review</text>

        <text x="0" y="54" class="pill-time" font-size="11">⏰ 09:30 – 10:30</text>
        <text x="0" y="74" class="pill-time" font-size="11">📍 Online (Zoom)</text>

        <g transform="translate(0, 90)">
          <circle cx="5" cy="5" r="4" fill="#ff6f91"/>
          <text x="14" y="9" class="pill-time" font-size="11">Work</text>
        </g>

        <text x="0" y="124" class="pill-meta">NOTES</text>
        <text x="0" y="142" class="pill-loc" font-size="11">Review the API changes for the</text>
        <text x="0" y="158" class="pill-loc" font-size="11">new pricing flow. Bring questions.</text>
      </g>

      <!-- separator -->
      <line x1="14" y1="200" x2="246" y2="200" class="border-strong"/>

      <!-- cluster section -->
      <g transform="translate(14, 214)">
        <text x="0" y="0" class="pill-meta">09:00 – 10:30 · 3 EVENTS</text>

        <g transform="translate(0, 18)">
          <rect x="0" y="0" width="3" height="32" fill="#5e9fff" rx="1"/>
          <text x="10" y="11" class="pill-time">09:00 – 09:30</text>
          <text x="10" y="26" class="text" font-size="12" font-weight="600">Standup</text>
        </g>

        <g transform="translate(0, 58)">
          <rect x="0" y="0" width="3" height="32" fill="#7d6cff" rx="1"/>
          <text x="10" y="11" class="pill-time">09:15 – 10:00</text>
          <text x="10" y="26" class="text" font-size="12" font-weight="600">1:1 with Sam</text>
        </g>

        <g transform="translate(0, 98)">
          <rect x="0" y="0" width="3" height="32" fill="#ff6f91" rx="1"/>
          <text x="10" y="11" class="pill-time">09:30 – 10:30</text>
          <text x="10" y="26" class="text" font-size="12" font-weight="600">Code review  ◀ hovered</text>
        </g>

        <text x="0" y="160" class="text-tiny" font-size="10">
          rows reuse make_row() from _popover_rows.py
        </text>
      </g>
    </g>

    <!-- STATE C: empty / default -->
    <g transform="translate(0, 460)">
      <text x="0" y="-6" class="label">C · default state (nothing hovered)</text>
      <rect x="0" y="0" width="260" height="180" rx="6" class="surface2" stroke="#6b6b85" stroke-width="1"/>
      <!-- truly empty per user spec -->
    </g>

    <!-- annotations on the right -->
    <g transform="translate(580, 60)">
      <text x="0" y="0" class="annot">Section order (top → bottom)</text>
      <g class="text-dim" font-size="11" transform="translate(0, 20)">
        <text x="0" y="0">1.  HOVERED meta label</text>
        <text x="0" y="16">2.  Title  (DemiBold, ≤3 lines)</text>
        <text x="0" y="32">3.  Time range</text>
        <text x="0" y="48">4.  Location  (hidden if none)</text>
        <text x="0" y="64">5.  Calendar swatch + name</text>
        <text x="0" y="80">6.  NOTES label + body</text>
        <text x="0" y="96">    (truncated ~6 lines)</text>
        <text x="0" y="120">— separator (hidden if no cluster) —</text>
        <text x="0" y="144">7.  Cluster header</text>
        <text x="0" y="160">    "HH:MM – HH:MM · N EVENTS"</text>
        <text x="0" y="180">8.  Sibling rows</text>
        <text x="0" y="196">    (color swatch | time | title)</text>
      </g>

      <text x="0" y="240" class="annot">Sizing</text>
      <g class="text-dim" font-size="11" transform="translate(0, 260)">
        <text x="0" y="0">min 220 px · max 420 px</text>
        <text x="0" y="16">default 280 px</text>
        <text x="0" y="32">wrapped in QScrollArea as</text>
        <text x="0" y="48">fallback for overflow.</text>
      </g>

      <text x="0" y="320" class="annot">Wiring</text>
      <g class="text-dim" font-size="11" transform="translate(0, 340)">
        <text x="0" y="0">EventChip.hovered   → show_event</text>
        <text x="0" y="16">LineCluster.hovered → show_cluster</text>
        <text x="0" y="32">hover_left           → clear</text>
      </g>
    </g>
  </g>

  <!-- footer caption -->
  <text x="700" y="846" text-anchor="middle" class="text-dim" font-size="11">
    docs/design-inspector-sidebar.svg · replaces the floating ClusterPopover with a persistent right-side pane in MainWindow's splitter
  </text>
</svg>
