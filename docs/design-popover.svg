<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" style="background:#0e0e0e">
  <defs>
    <filter id="popshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" in="SourceAlpha"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="140" y="20" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Fri 29</text>
  <text x="5" y="50" fill="#888" font-size="9">5 PM</text>
  <text x="5" y="120" fill="#888" font-size="9">6 PM</text>
  <text x="5" y="190" fill="#888" font-size="9">7 PM</text>
  <text x="5" y="260" fill="#888" font-size="9">8 PM</text>
  <text x="5" y="330" fill="#888" font-size="9">9 PM</text>
  <line x1="35" y1="45" x2="275" y2="45" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="35" y1="115" x2="275" y2="115" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="35" y1="185" x2="275" y2="185" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="35" y1="255" x2="275" y2="255" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="35" y1="325" x2="275" y2="325" stroke="#2a2a2a" stroke-width="0.5"/>
  <line x1="280" y1="30" x2="280" y2="370" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Main chip (Yoga, dominant) -->
  <rect x="38" y="48" width="190" height="88" rx="3" fill="#ec4899" fill-opacity="0.92"/>
  <text x="48" y="68" fill="#fff" font-size="11" font-weight="600">Yoga · Heated Vinyasa</text>
  <text x="48" y="82" fill="#fff" font-size="9" opacity="0.85">5:00 – 6:15 PM</text>
  <text x="48" y="96" fill="#fff" font-size="9" opacity="0.7">Mission Studios</text>

  <!-- Spine separator -->
  <line x1="232" y1="48" x2="232" y2="293" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Thin spine lines -->
  <rect x="236" y="83" width="4" height="70" rx="1" fill="#f97316"/>
  <rect x="242" y="118" width="4" height="105" rx="1" fill="#a855f7"/>
  <rect x="248" y="153" width="4" height="70" rx="1" fill="#06b6d4"/>
  <rect x="254" y="188" width="4" height="105" rx="1" fill="#84cc16"/>

  <!-- Side-anchored popover -->
  <g filter="url(#popshadow)">
    <rect x="300" y="40" width="310" height="240" rx="8" fill="#181818" stroke="#3a3a3a" stroke-width="0.5"/>
    <text x="312" y="62" fill="#888" font-size="10" font-weight="600">5:00 — 8:30 PM · 5 EVENTS</text>
    <rect x="312" y="78" width="3" height="36" fill="#ec4899"/>
    <text x="324" y="94" fill="#aaa" font-size="10">5:00 – 6:15 PM</text>
    <text x="324" y="108" fill="#fff" font-size="11" font-weight="600">Yoga · Heated Vinyasa</text>
    <rect x="312" y="120" width="3" height="36" fill="#f97316"/>
    <text x="324" y="136" fill="#aaa" font-size="10">5:30 – 6:30 PM</text>
    <text x="324" y="150" fill="#fff" font-size="11" font-weight="600">Daniela birthday drinks</text>
    <rect x="312" y="162" width="3" height="36" fill="#a855f7"/>
    <text x="324" y="178" fill="#aaa" font-size="10">6:00 – 7:30 PM</text>
    <text x="324" y="192" fill="#fff" font-size="11" font-weight="600">Book club · Pachinko</text>
    <rect x="312" y="204" width="3" height="36" fill="#06b6d4"/>
    <text x="324" y="220" fill="#aaa" font-size="10">6:30 – 7:30 PM</text>
    <text x="324" y="234" fill="#fff" font-size="11" font-weight="600">Stand-up comedy showcase</text>
    <rect x="312" y="246" width="3" height="22" fill="#84cc16"/>
    <text x="324" y="262" fill="#aaa" font-size="10">7:00 – 8:30 PM · Tennis · doubles</text>
  </g>
</svg>
