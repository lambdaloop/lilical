[workspace]
name = "lilical"
version = "0.1.0"
description = "Linux calendar app — Google, Outlook, CalDAV"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pyside6 = ">=6.11"
sqlalchemy = ">=2.0"
alembic = "*"
google-api-python-client = "*"
google-auth-oauthlib = "*"
caldav = ">=1.3"
icalendar = ">=5.0"
keyring = "*"
tzdata = "*"
dateparser = "*"

[pypi-dependencies]
qasync = ">=0.28"
recurring-ical-events = ">=2.2"
desktop-notifier = "*"
msal = "*"
httpx = ">=0.27,<1.0"

[pypi-options]
prerelease-mode = "allow"

[feature.dev.dependencies]
ruff = "*"
basedpyright = "*"
pytest = "*"
pytest-qt = "*"
pytest-asyncio = "*"
pytest-cov = "*"

[feature.dev.pypi-dependencies]
pytest-recording = "*"

[environments]
default = { features = [], solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }

[tasks]
run        = { cmd = "python -m lilical", env = { PYTHONPATH = "src" } }
test       = { cmd = "pytest -v", env = { PYTHONPATH = "src" } }
test-cov   = { cmd = "pytest --cov=lilical --cov-report=term-missing", env = { PYTHONPATH = "src" } }
lint       = { cmd = "ruff check src tests", env = { PYTHONPATH = "src" } }
fmt        = { cmd = "ruff format src tests", env = { PYTHONPATH = "src" } }
typecheck  = { cmd = "basedpyright src", env = { PYTHONPATH = "src" } }
migrate    = { cmd = "alembic upgrade head", env = { PYTHONPATH = "src" } }
makemig    = { cmd = "alembic revision --autogenerate -m", depends-on = [], env = { PYTHONPATH = "src" } }
radicale   = "docker run --rm -p 5232:5232 tomsquest/docker-radicale"
