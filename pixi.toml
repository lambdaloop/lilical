[workspace]
name = "lilical"
version = "0.1.0"
description = "Linux calendar app — Google, Outlook, CalDAV"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pyside6 = ">=6.11"
sqlalchemy = ">=2.0"
alembic = "*"
google-auth = "*"
google-auth-oauthlib = "*"
caldav = ">=1.3"
icalendar = ">=5.0"
vobject = "*"
keyring = "*"
tzdata = "*"
dateparser = "*"

[pypi-dependencies]
lilical = { path = ".", editable = true }
qasync = ">=0.28"
recurring-ical-events = ">=2.2"
desktop-notifier = "*"
msal = "*"
httpx = ">=0.27,<1.0"

[pypi-options]
prerelease-mode = "allow"

[feature.dev.dependencies]
ruff = "*"
basedpyright = "*"
pytest = "*"
pytest-qt = "*"
pytest-asyncio = "*"
pytest-cov = "*"

[feature.dev.pypi-dependencies]
pytest-recording = "*"

[feature.appimage.dependencies]
font-ttf-noto       = "*"
font-ttf-noto-emoji = "*"

[feature.appimage.pypi-dependencies]
pyinstaller = ">=6.0"

[environments]
default = { features = [], solve-group = "main" }
dev = { features = ["dev"], solve-group = "main" }
appimage = { features = ["appimage"], solve-group = "main" }

[tasks]
run        = "python -m lilical"
test       = "pytest -v"
test-cov   = "pytest --cov=lilical --cov-report=term-missing"
lint       = "ruff check src tests"
fmt        = "ruff format src tests"
typecheck = "find src -type d -name __pycache__ -exec rm -rf '{}' + ; basedpyright --threads 1 --level error src"
migrate    = "alembic upgrade head"
makemig    = { cmd = "alembic revision --autogenerate -m", depends-on = [] }
radicale   = "docker run --rm -p 5232:5232 tomsquest/docker-radicale"
