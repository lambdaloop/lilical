app-id: org.lilical.Lilical
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: lilical

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-data/lilical
  - --filesystem=xdg-config/lilical
  - --filesystem=xdg-cache/lilical

modules:
  - python3-modules.yml
  - name: lilical
    buildsystem: simple
    build-commands:
      - python3 tools/generate_oauth_embedded.py
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 alembic.ini ${FLATPAK_DEST}/share/lilical/alembic.ini
      - cp -r migrations ${FLATPAK_DEST}/share/lilical/migrations
      - install -Dm644 data/org.lilical.Lilical.desktop ${FLATPAK_DEST}/share/applications/org.lilical.Lilical.desktop
      - install -Dm644 data/org.lilical.Lilical.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.lilical.Lilical.metainfo.xml
      - install -Dm644 data/org.lilical.Lilical.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/org.lilical.Lilical.svg
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .pixi
          - .pytest_cache
          - __pycache__
          - flatpak/build-dir
          - flatpak/repo
          - flatpak/.flatpak-builder
          - dist
          - build
