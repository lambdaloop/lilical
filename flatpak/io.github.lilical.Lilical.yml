app-id: io.github.lilical.Lilical
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: lilical

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-data/lilical
  - --filesystem=xdg-config/lilical
  - --filesystem=xdg-cache/lilical

modules:
  - python3-modules.yml
  - name: lilical
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/io.github.lilical.Lilical.desktop ${FLATPAK_DEST}/share/applications/io.github.lilical.Lilical.desktop
      - install -Dm644 data/io.github.lilical.Lilical.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.lilical.Lilical.metainfo.xml
      - install -Dm644 data/io.github.lilical.Lilical.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.lilical.Lilical.svg
    sources:
      - type: dir
        path: ..
