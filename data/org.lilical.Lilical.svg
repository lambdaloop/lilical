<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <clipPath id="pageClip">
      <rect x="10" y="8" width="108" height="114" rx="14"/>
    </clipPath>
    <linearGradient id="headerShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <rect x="10" y="10" width="108" height="114" rx="14" fill="#00000020"/>

  <!-- Page body -->
  <rect x="10" y="8" width="108" height="114" rx="14" fill="#FCFCFC" stroke="#D0D0D0" stroke-width="2"/>

  <!-- Header bar -->
  <rect x="10" y="8" width="108" height="38" fill="#2563EB" clip-path="url(#pageClip)"/>

  <!-- Subtle header gradient overlay for depth -->
  <rect x="10" y="8" width="108" height="38" fill="url(#headerShine)" clip-path="url(#pageClip)" opacity="0.25"/>

  <!-- Binder holes -->
  <circle cx="36" cy="16" r="4.5" fill="#FCFCFC" opacity="0.7"/>
  <circle cx="92" cy="16" r="4.5" fill="#FCFCFC" opacity="0.7"/>

  <!-- Date blocks — row 1 -->
  <rect x="28" y="56" width="20" height="13" rx="3" fill="#D1D5DB"/>
  <rect x="54" y="56" width="20" height="13" rx="3" fill="#D1D5DB"/>
  <rect x="80" y="56" width="20" height="13" rx="3" fill="#D1D5DB"/>

  <!-- Date blocks — row 2 -->
  <rect x="28" y="74" width="20" height="13" rx="3" fill="#D1D5DB"/>
  <rect x="54" y="74" width="20" height="13" rx="3" fill="#2563EB"/>
  <rect x="80" y="74" width="20" height="13" rx="3" fill="#D1D5DB"/>

  <!-- Date blocks — row 3 -->
  <rect x="28" y="92" width="20" height="13" rx="3" fill="#D1D5DB"/>
  <rect x="54" y="92" width="20" height="13" rx="3" fill="#D1D5DB"/>
  <rect x="80" y="92" width="20" height="13" rx="3" fill="#D1D5DB"/>
</svg>
